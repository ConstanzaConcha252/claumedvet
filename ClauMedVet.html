<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>ClauMedVet — Sistema de Gestión</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600&family=DM+Serif+Display&display=swap" rel="stylesheet"/>
<style>
:root{
  --teal:#1e8fa0;--teal-d:#136273;--teal-l:#e0f4f7;--teal-m:#8fd4e0;
  --green:#1a9e78;--green-d:#0d6e55;--green-l:#e0f5ee;
  --amber:#c97d10;--amber-l:#faeeda;
  --red:#c94040;--red-l:#fceaea;
  --purple:#5238a8;--purple-l:#f0eeff;
  --ink:#1a1c1e;--ink2:#3e4347;--ink3:#6b7177;--ink4:#9ba3aa;
  --bg:#f4f3ef;--bg2:#eceae4;--surface:#fff;--border:#dedad3;
  --radius:12px;
  --shadow:0 1px 3px rgba(0,0,0,.07),0 4px 16px rgba(0,0,0,.05);
  --shadow-lg:0 8px 32px rgba(0,0,0,.13);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--ink);font-size:15px;line-height:1.5;height:100vh;height:100dvh;overflow:hidden;display:flex}

/* ── SIDEBAR ── */
.sidebar{width:260px;min-width:260px;background:linear-gradient(175deg,#145f6e 0%,#1a8fa0 55%,#1e9e8a 100%);display:flex;flex-direction:column;height:100vh;height:100dvh}
.logo-wrap{padding:16px 16px 13px;border-bottom:1px solid rgba(255,255,255,.15)}
.logo{display:flex;align-items:center;gap:10px}
.logo-img{width:50px;height:50px;flex-shrink:0;filter:drop-shadow(0 2px 6px rgba(0,0,0,.3))}
.logo-name{font-family:'DM Serif Display',serif;font-size:17px;color:#fff;line-height:1.15}
.logo-sub{font-size:10px;color:rgba(255,255,255,.6);letter-spacing:.03em}
.nav{padding:10px 8px 4px}
.nav-item{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:9px;cursor:pointer;font-size:13px;color:rgba(255,255,255,.75);transition:all .15s;margin-bottom:2px}
.nav-item:hover{background:rgba(255,255,255,.15);color:#fff}
.nav-item.active{background:rgba(255,255,255,.2);color:#fff;font-weight:600}
.nav-item svg{width:16px;height:16px;flex-shrink:0}
.nav-badge{margin-left:auto;background:var(--red);color:#fff;font-size:10px;font-weight:700;padding:1px 7px;border-radius:20px;display:none}
.nav-badge.show{display:inline}
.sidebar-divider{height:1px;background:rgba(255,255,255,.15);margin:5px 8px 7px}
.recent-label{font-size:10px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:rgba(255,255,255,.5);padding:0 18px 6px}
.recent-list{flex:1;overflow-y:auto;padding:0 8px 10px;min-height:0}
.recent-item{display:flex;align-items:center;gap:9px;padding:6px 10px;border-radius:9px;cursor:pointer;transition:background .15s}
.recent-item:hover{background:rgba(255,255,255,.12)}
.recent-item.active{background:rgba(255,255,255,.2)}
.r-avatar{width:27px;height:27px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;flex-shrink:0}
.r-name{font-size:12px;font-weight:500;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.r-sub{font-size:11px;color:rgba(255,255,255,.55);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sidebar-bottom{padding:10px 14px;border-top:1px solid rgba(255,255,255,.15);font-size:11px;color:rgba(255,255,255,.4);display:flex;align-items:center;gap:6px}

/* ── MAIN ── */
.main{flex:1;display:flex;flex-direction:column;overflow:hidden;height:100vh;height:100dvh}
.topbar{background:var(--surface);border-bottom:1px solid var(--border);padding:11px 22px;display:flex;align-items:center;gap:12px;flex-shrink:0}
.topbar-title{font-family:'DM Serif Display',serif;font-size:19px;color:var(--ink);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.search-wrap{display:flex;align-items:center;background:var(--bg);border:1px solid var(--border);border-radius:9px;padding:0 10px;gap:6px;transition:border-color .15s,box-shadow .15s}
.search-wrap:focus-within{border-color:var(--teal);box-shadow:0 0 0 3px rgba(30,143,160,.12);background:var(--surface)}
.search-wrap svg{width:15px;height:15px;color:var(--ink4);flex-shrink:0}
.search-wrap input{border:none;background:transparent;font-family:'DM Sans',sans-serif;font-size:13px;color:var(--ink);width:200px;outline:none;padding:8px 0}
.btn{padding:8px 16px;border-radius:9px;border:1px solid var(--border);background:var(--surface);font-family:'DM Sans',sans-serif;font-size:13px;font-weight:500;color:var(--ink);cursor:pointer;transition:all .15s;white-space:nowrap}
.btn:hover{background:var(--bg);border-color:#c5c0b8}
.btn-teal{background:var(--teal);color:#fff;border-color:var(--teal)}
.btn-teal:hover{background:var(--teal-d);border-color:var(--teal-d)}
.btn-green{background:var(--green);color:#fff;border-color:var(--green)}
.btn-green:hover{background:var(--green-d)}
.btn-sm{padding:5px 11px;font-size:12px}
.btn-xs{padding:3px 8px;font-size:11px}
.btn-danger{color:var(--red);border-color:#f5b8b8}
.btn-danger:hover{background:var(--red-l)}
.content{flex:1;overflow-y:auto;padding:20px;min-height:0;-webkit-overflow-scrolling:touch}

/* ── CARDS ── */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow)}
.card-p{padding:18px}
.card-header{display:flex;align-items:center;justify-content:space-between;padding:13px 18px;border-bottom:1px solid var(--border)}
.card-title{font-size:14px;font-weight:600}

/* ── STATS ── */
.stats-row{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px;margin-bottom:16px}
.stat-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px 16px;box-shadow:var(--shadow)}
.stat-label{font-size:11px;color:var(--ink4);font-weight:500;letter-spacing:.02em;margin-bottom:4px}
.stat-value{font-family:'DM Serif Display',serif;font-size:28px;line-height:1}
.stat-sub{font-size:11px;color:var(--ink4);margin-top:3px}
.sv-teal .stat-value{color:var(--teal-d)}
.sv-red  .stat-value{color:var(--red)}
.sv-amber .stat-value{color:var(--amber)}
.sv-green .stat-value{color:var(--green-d)}
.sv-purple .stat-value{color:var(--purple)}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:14px}

/* ── TAGS / STATUS ── */
.tag{display:inline-block;padding:2px 8px;border-radius:20px;font-size:11px;font-weight:600}
.tag-dog{background:#e7f0fb;color:#1b4ea0}.tag-cat{background:#f0eeff;color:#5238a8}
.tag-rabbit{background:#fceaf0;color:#952d59}.tag-bird{background:#eaf5de;color:#2e6010}
.tag-other{background:var(--bg2);color:var(--ink3)}
.status{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:20px;font-size:11px;font-weight:600}
.status::before{content:'';width:6px;height:6px;border-radius:50%}
.s-ok{background:#eaf5de;color:#2e6010}.s-ok::before{background:#3b6d11}
.s-warn{background:var(--amber-l);color:#7a4d08}.s-warn::before{background:var(--amber)}
.s-alert{background:var(--red-l);color:#8a2020}.s-alert::before{background:var(--red)}
.s-sched{background:var(--teal-l);color:var(--teal-d)}.s-sched::before{background:var(--teal)}
.s-done{background:#eaf5de;color:#2e6010}.s-done::before{background:#3b6d11}
.s-paid{background:#eaf5de;color:#2e6010}.s-paid::before{background:#3b6d11}
.s-partial{background:var(--amber-l);color:#7a4d08}.s-partial::before{background:var(--amber)}
.s-unpaid{background:var(--red-l);color:#8a2020}.s-unpaid::before{background:var(--red)}

/* ── TABLE ── */
table{width:100%;border-collapse:collapse;font-size:13px}
thead th{text-align:left;padding:9px 13px;font-size:11px;font-weight:600;color:var(--ink4);letter-spacing:.04em;text-transform:uppercase;border-bottom:1px solid var(--border);white-space:nowrap}
tbody td{padding:10px 13px;border-bottom:1px solid var(--bg2)}
tbody tr:last-child td{border-bottom:none}
tbody tr{cursor:pointer;transition:background .1s}
tbody tr:hover td{background:var(--bg)}

/* ── ALERTS ── */
.alert-row{display:flex;align-items:flex-start;gap:12px;padding:11px 14px;border-radius:10px;margin-bottom:8px;cursor:pointer}
.alert-row:hover{filter:brightness(.97)}
.ar-urgent{background:#fff2ef;border:1px solid #f5b8a0}
.ar-warn{background:var(--amber-l);border:1px solid #f5d48a}
.ar-ok{background:var(--green-l);border:1px solid #9fe0cb}
.ar-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;margin-top:5px}
.d-urgent{background:var(--red)}.d-warn{background:var(--amber)}.d-ok{background:var(--green)}
.ar-body{flex:1}
.ar-name{font-size:13px;font-weight:600;margin-bottom:2px}
.ar-meta{font-size:12px;color:var(--ink3)}
.ar-days{font-size:12px;font-weight:600;white-space:nowrap;padding-top:2px}
.days-urgent{color:var(--red)}.days-warn{color:var(--amber)}.days-ok{color:var(--green-d)}

/* ── PATIENT DETAIL ── */
.detail-wrap{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden;margin-bottom:14px}
.profile-hero{display:flex;align-items:flex-start;gap:16px;padding:18px 22px;border-bottom:1px solid var(--border);flex-wrap:wrap}
.hero-avatar{width:56px;height:56px;border-radius:50%;border:3px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:26px;flex-shrink:0}
.hero-avatar img{width:100%;height:100%;object-fit:cover;border-radius:50%;}
.avatar-wrap{position:relative;flex-shrink:0;}
.hero-avatar-clickable{cursor:zoom-in;}
.hero-avatar-clickable:hover{filter:brightness(.92);}
.avatar-edit-btn{position:absolute;bottom:-2px;right:-2px;width:23px;height:23px;border-radius:50%;background:var(--teal);color:#fff;border:2px solid var(--surface);font-size:11px;display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0;line-height:1;box-shadow:0 1px 4px rgba(0,0,0,.25);}
.avatar-edit-btn:hover{background:var(--teal-d);}
.hero-name{font-family:'DM Serif Display',serif;font-size:20px;line-height:1.2}
.hero-meta{font-size:13px;color:var(--ink3);margin-top:2px}
.info-chips{display:flex;gap:9px;flex-wrap:wrap;padding:12px 22px;border-bottom:1px solid var(--border)}
.chip{background:var(--bg);border:1px solid var(--border);border-radius:9px;padding:7px 12px}
.chip-label{font-size:10px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--ink4);margin-bottom:2px}
.chip-value{font-weight:600;color:var(--ink);font-size:13px}
.tab-bar{display:flex;padding:0 22px;border-bottom:1px solid var(--border)}
.tab{padding:10px 14px;font-size:13px;font-weight:500;color:var(--ink4);cursor:pointer;border-bottom:2px solid transparent;transition:all .15s;margin-bottom:-1px;white-space:nowrap}
.tab:hover{color:var(--ink)}
.tab.active{color:var(--teal-d);border-bottom-color:var(--teal);font-weight:600}
.tab-content{padding:16px 22px}
.history-card{background:var(--bg);border:1px solid var(--border);border-radius:10px;padding:12px 15px;margin-bottom:10px}
.hc-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:5px}
.hc-date{font-size:12px;color:var(--ink4);font-weight:500}
.hc-motivo{font-size:14px;font-weight:600}
.hc-notes{font-size:13px;color:var(--ink2);margin-top:5px}
.hc-vitals{display:flex;gap:8px;margin-top:8px}
.vital{font-size:11px;font-weight:600;background:var(--surface);border:1px solid var(--border);border-radius:6px;padding:3px 9px;color:var(--ink3)}
.vac-row{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--bg2)}
.vac-row:last-child{border-bottom:none}

/* ── AGENDA ── */
.agenda-day-header{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--teal-d);padding:5px 0 7px;margin-bottom:4px;border-bottom:2px solid var(--teal-l);margin-top:16px}
.agenda-day-header:first-child{margin-top:0}
.appt-card{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:12px 14px;margin-bottom:8px;display:flex;align-items:flex-start;gap:12px;transition:box-shadow .15s}
.appt-card:hover{box-shadow:0 2px 12px rgba(0,0,0,.09)}
.appt-card.done-card{opacity:.55}
.appt-time{min-width:48px;text-align:center;font-family:'DM Serif Display',serif;font-size:17px;color:var(--teal-d);line-height:1;padding-top:2px}
.appt-time-sub{font-family:'DM Sans',sans-serif;font-size:10px;color:var(--ink4);font-weight:500;letter-spacing:.04em}
.appt-divider{width:1px;background:var(--border);align-self:stretch;flex-shrink:0}
.appt-body{flex:1}
.appt-patient{font-size:14px;font-weight:600;margin-bottom:2px}
.appt-motivo{font-size:13px;color:var(--ink3);margin-bottom:2px}
.appt-meta{font-size:12px;color:var(--ink4);margin-top:2px}
.appt-actions{display:flex;flex-direction:column;gap:5px;align-items:flex-end;flex-shrink:0}
.filter-bar{display:flex;align-items:center;gap:8px;margin-bottom:14px;flex-wrap:wrap}
.filter-btn{padding:6px 13px;border-radius:20px;font-size:12px;font-weight:500;border:1px solid var(--border);background:var(--surface);cursor:pointer;color:var(--ink3);transition:all .15s}
.filter-btn:hover{background:var(--bg)}
.filter-btn.active{background:var(--teal-l);color:var(--teal-d);border-color:var(--teal-m);font-weight:600}

/* ── BILLING ── */
.bill-card{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:14px 16px;margin-bottom:8px;transition:box-shadow .15s}
.bill-card:hover{box-shadow:0 2px 12px rgba(0,0,0,.09)}
.bill-header{display:flex;align-items:flex-start;gap:10px;margin-bottom:8px}
.bill-patient{font-size:14px;font-weight:600}
.bill-tutor{font-size:12px;color:var(--ink4)}
.bill-items-table{width:100%;font-size:12px;border-collapse:collapse;margin-bottom:8px}
.bill-items-table th{text-align:left;color:var(--ink4);font-weight:600;padding:4px 6px;border-bottom:1px solid var(--bg2);font-size:11px}
.bill-items-table td{padding:5px 6px;border-bottom:1px solid var(--bg2)}
.bill-items-table tr:last-child td{border-bottom:none}
.bill-total{display:flex;justify-content:space-between;align-items:center;padding-top:8px;border-top:1px solid var(--border)}
.bill-total-label{font-size:12px;font-weight:600;color:var(--ink3)}
.bill-total-amount{font-family:'DM Serif Display',serif;font-size:20px;color:var(--ink)}
.paid-amount{font-size:12px;color:var(--green-d);font-weight:500}
.debt-amount{font-size:12px;color:var(--red);font-weight:500}
.item-row-edit{display:flex;gap:8px;align-items:center;margin-bottom:8px}
.item-row-edit input{flex:1}
.item-row-edit input.item-qty{width:60px;flex:none}
.item-row-edit input.item-price{width:90px;flex:none}
.add-item-btn{display:flex;align-items:center;gap:6px;padding:8px 12px;border:1px dashed var(--border);border-radius:9px;background:none;cursor:pointer;font-size:13px;color:var(--ink4);width:100%;justify-content:center;transition:all .15s;margin-bottom:12px}
.add-item-btn:hover{background:var(--bg);color:var(--ink)}
.pay-row{display:flex;gap:8px;align-items:center}

/* ── MODAL ── */
.overlay{position:fixed;inset:0;background:rgba(15,20,25,.45);backdrop-filter:blur(3px);display:flex;align-items:center;justify-content:center;z-index:1000;animation:fadeIn .15s ease}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.modal{background:var(--surface);border-radius:16px;padding:24px;width:500px;max-height:90vh;overflow-y:auto;box-shadow:var(--shadow-lg);animation:slideUp .2s ease;position:relative}
.modal-lg{width:620px}
.modal-sm{width:380px}
@keyframes slideUp{from{transform:translateY(14px);opacity:0}to{transform:translateY(0);opacity:1}}
.modal-title{font-family:'DM Serif Display',serif;font-size:20px;margin-bottom:18px}
.modal-footer{display:flex;justify-content:flex-end;gap:8px;margin-top:20px}
.form-group{margin-bottom:12px;position:relative}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:11px}
.form-row-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:11px}
label{display:block;font-size:12px;font-weight:600;color:var(--ink3);letter-spacing:.03em;margin-bottom:4px}
input[type=text],input[type=number],input[type=email],input[type=tel],input[type=date],input[type=time],select,textarea{
  width:100%;padding:8px 11px;border:1px solid var(--border);border-radius:9px;
  background:var(--bg);font-family:'DM Sans',sans-serif;font-size:13px;color:var(--ink);
  outline:none;transition:border-color .15s,box-shadow .15s,background .15s}
input:focus,select:focus,textarea:focus{border-color:var(--teal);box-shadow:0 0 0 3px rgba(30,143,160,.12);background:var(--surface)}
textarea{resize:vertical;min-height:70px}
select{cursor:pointer}
.autocomplete-list{position:absolute;top:100%;left:0;right:0;background:var(--surface);border:1px solid var(--border);border-top:none;border-radius:0 0 9px 9px;z-index:200;box-shadow:var(--shadow);display:none;max-height:180px;overflow-y:auto}
.autocomplete-list.open{display:block}
.autocomplete-item{padding:8px 12px;cursor:pointer;font-size:13px;border-bottom:1px solid var(--bg2)}
.autocomplete-item:last-child{border-bottom:none}
.autocomplete-item:hover{background:var(--bg)}

.empty{text-align:center;padding:38px 20px}
.empty-icon{font-size:32px;margin-bottom:10px}
.empty-text{font-size:14px;color:var(--ink3)}
.empty-sub{font-size:13px;color:var(--ink4);margin-top:4px}
.section-heading{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.section-title{font-size:11px;font-weight:700;color:var(--ink4);text-transform:uppercase;letter-spacing:.06em}
.notif-banner{background:linear-gradient(135deg,#fff2ef,#fff8f0);border:1px solid #f5b8a0;border-radius:var(--radius);padding:12px 15px;margin-bottom:14px;display:flex;align-items:center;gap:12px;cursor:pointer}
.notif-banner:hover{filter:brightness(.97)}
.notif-title{font-size:13px;font-weight:600;color:var(--red)}
.notif-sub{font-size:12px;color:var(--ink3);margin-top:1px}
.back-link{font-size:13px;color:var(--ink4);cursor:pointer;display:inline-flex;align-items:center;gap:4px;padding:4px 0;margin-bottom:13px}
.back-link:hover{color:var(--ink)}
.toast{position:fixed;bottom:20px;right:20px;background:var(--ink);color:#fff;padding:10px 17px;border-radius:10px;font-size:13px;font-weight:500;box-shadow:var(--shadow-lg);z-index:2000;display:none;animation:slideUp .2s ease}
.toast.show{display:block}
.hr{border:none;border-top:1px solid var(--border);margin:12px 0}
::-webkit-scrollbar{width:5px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:var(--bg2);border-radius:4px}

/* ── LOGIN ── */
#loginScreen{
  position:fixed;inset:0;z-index:9999;
  background:linear-gradient(135deg,#145f6e 0%,#1a8fa0 55%,#1e9e8a 100%);
  display:flex;align-items:center;justify-content:center;
}
.login-box{
  background:#fff;border-radius:20px;padding:40px 44px;width:360px;
  box-shadow:0 20px 60px rgba(0,0,0,.25);text-align:center;
}
.login-logo{width:72px;height:72px;object-fit:contain;border-radius:12px;margin-bottom:16px;}
.login-title{font-family:'DM Serif Display',serif;font-size:26px;color:var(--teal-d);margin-bottom:4px;}
.login-sub{font-size:13px;color:var(--ink4);margin-bottom:28px;}
.login-field{text-align:left;margin-bottom:14px;}
.login-field label{display:block;font-size:12px;font-weight:600;color:var(--ink3);letter-spacing:.03em;margin-bottom:5px;}
.login-field input{width:100%;padding:10px 13px;border:1px solid var(--border);border-radius:10px;background:var(--bg);font-family:'DM Sans',sans-serif;font-size:14px;color:var(--ink);outline:none;transition:border-color .15s,box-shadow .15s;}
.login-field input:focus{border-color:var(--teal);box-shadow:0 0 0 3px rgba(30,143,160,.15);}
.login-btn{width:100%;padding:11px;border-radius:10px;border:none;background:var(--teal);color:#fff;font-family:'DM Sans',sans-serif;font-size:15px;font-weight:600;cursor:pointer;margin-top:6px;transition:background .15s;}
.login-btn:hover{background:var(--teal-d);}
.login-error{color:var(--red);font-size:13px;margin-top:10px;display:none;}
.login-version{font-size:11px;color:var(--ink4);margin-top:20px;}
@keyframes shake{0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}

/* ══════════════════════════════════════════
   RESPONSIVE — TABLET & MÓVIL
   ══════════════════════════════════════════ */
.stats-row{grid-template-columns:repeat(auto-fit,minmax(130px,1fr))}
.menu-toggle{display:none;align-items:center;justify-content:center;width:36px;height:36px;border-radius:9px;border:1px solid var(--border);background:var(--surface);cursor:pointer;flex-shrink:0;font-size:18px;color:var(--ink2)}
.menu-toggle:hover{background:var(--bg)}
.sidebar-backdrop{display:none;position:fixed;inset:0;background:rgba(10,15,20,.45);z-index:1550}
.sidebar-backdrop.show{display:block}
.table-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
.cloud-badge-top{font-size:16px;padding:6px 8px;border-radius:8px;cursor:default;display:inline-flex;align-items:center;flex-shrink:0}

@media (max-width:1024px){
  input[type=text],input[type=number],input[type=email],input[type=tel],input[type=date],input[type=time],select,textarea,.search-wrap input,.login-field input{font-size:16px}
  .menu-toggle{display:flex}
  .sidebar{position:fixed;top:0;left:0;z-index:1600;transform:translateX(-100%);transition:transform .25s ease;box-shadow:0 0 40px rgba(0,0,0,.3)}
  .sidebar.open{transform:translateX(0)}
  .content{padding:14px}
  .topbar{padding:10px 14px;flex-wrap:wrap;row-gap:8px}
  .topbar-title{font-size:16px}
  .search-wrap{order:5;flex:1 1 100%}
  .search-wrap input{width:100%}
  .grid-2{grid-template-columns:1fr}
  .modal-lg{width:min(620px,94vw)}
}

@media (max-width:640px){
  .modal,.modal-lg,.modal-sm{width:92vw;padding:18px;max-height:85vh}
  .form-row,.form-row-3{grid-template-columns:1fr}
  [style*="grid-template-columns:repeat(3,minmax(0,1fr))"]{grid-template-columns:1fr 1fr!important}
}

@media (max-width:480px){
  .topbar-add-btn .btn-label{display:none}
  .topbar-add-btn{padding:8px 11px}
  [style*="grid-template-columns:repeat(3,minmax(0,1fr))"]{grid-template-columns:1fr!important}
  .tab-bar{overflow-x:auto;-webkit-overflow-scrolling:touch}
  .vac-row{flex-wrap:wrap;row-gap:6px}
  .appt-card{flex-wrap:wrap}
  .appt-divider{display:none}
  .appt-actions{flex-direction:row;flex-wrap:wrap;width:100%;align-items:center;margin-top:8px}
  .login-box{width:88vw;padding:30px 24px}
  .stat-value{font-size:22px}
}
</style>
</head>
<body>

  <div class="login-box">
    <img class="login-logo" src="data:image/svg+xml,%3Csvg viewBox='0 0 120 120' fill='none' xmlns='http://www.w3.org/2000/svg'%3E%3Crect width='120' height='120' rx='20' fill='%231e8fa0'/%3E%3Cpath d='M18 58L60 16L102 58L102 106L18 106Z' stroke='white' stroke-width='5' fill='none' stroke-linejoin='round'/%3E%3Cpath d='M8 60L60 12L112 60' stroke='white' stroke-width='5' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3Cpath d='M60 82C60 82 43 69 43 59.5C43 53.5 47.8 48.5 54 48.5C57.2 48.5 59.5 50.5 60 52C60.5 50.5 62.8 48.5 66 48.5C72.2 48.5 77 53.5 77 59.5C77 69 60 82 60 82Z' stroke='white' stroke-width='4' fill='none'/%3E%3C/svg%3E" alt="ClauMedVet"/>

    <div class="login-sub">Sistema de Gestión Veterinaria</div>
    <div class="login-field">
      <label>Usuario</label>
      <input type="text" id="loginUser" placeholder="Tu usuario" autocomplete="username"/>
    </div>
    <div class="login-field">
      <label>Contraseña</label>
      <input type="password" id="loginPass" placeholder="Tu contraseña" autocomplete="current-password"/>
    </div>
    <button class="login-btn" id="loginBtn">Entrar</button>
    <div class="login-error" id="loginError">Usuario o contraseña incorrectos</div>
    <div class="login-version">ClauMedVet · Curicó</div>
  </div>
</div>

  'apikey':SUPABASE_KEY,
  'Authorization':`Bearer ${SUPABASE_KEY}`,
  'Content-Type':'application/json',
  'Prefer':'return=minimal'
};
let cloudSyncEnabled=true;
let cloudStatus='connecting'; // connecting | online | offline | error

async function sbFetch(path,opts={}){
  const url=`${SUPABASE_URL}/rest/v1/${path}`;
  const headers={...SB_HEADERS,...(opts.headers||{})};
  try{
    const res=await fetch(url,{...opts,headers});
    if(!res.ok){
      const txt=await res.text().catch(()=>'');
      console.error(`Supabase ${opts.method||'GET'} ${path} → ${res.status}:`,txt);
      throw new Error(`${res.status} ${txt}`);
    }
    return res;
  }catch(err){
    console.warn('Supabase request failed:',path,err);
    throw err;
  }
}

    vaccinations:p.vaccinations||[],history:p.history||[],

// Pull all data from Supabase and replace local DB (used on startup)
async function pullFromCloud(){
  cloudStatus='connecting';renderCloudBadge();
  try{
    const [pRes,aRes,iRes,cRes]=await Promise.all([
      sbFetch('patients?select=*&order=id.asc'),
      sbFetch('appointments?select=*&order=id.asc'),
      sbFetch('invoices?select=*&order=id.asc'),
      sbFetch('app_config?select=*')
    ]);
    const patientsRows=await pRes.json();
    const apptRows=await aRes.json();
    const invRows=await iRes.json();
    const configRows=await cRes.json();

    if(patientsRows.length||apptRows.length||invRows.length){
      DB.patients=patientsRows.map(rowToPatient);
      DB.appointments=apptRows.map(rowToAppt);
      DB.invoices=invRows.map(rowToInvoice);
      const cfg={};configRows.forEach(c=>cfg[c.key]=c.value);
      DB.nextId=cfg.next_patient_id||(Math.max(0,...DB.patients.map(p=>p.id))+1);
      DB.nextAid=cfg.next_appt_id||(Math.max(0,...DB.appointments.map(a=>a.id))+1);
      DB.nextInvId=cfg.next_invoice_id||(Math.max(0,...DB.invoices.map(i=>i.id))+1);
      localStorage.setItem('claudmedvet_v2',JSON.stringify(DB));
    }
    cloudStatus='online';renderCloudBadge();
    return true;
  }catch(err){
    console.warn('No se pudo conectar a Supabase, usando datos locales.',err);
    cloudStatus='offline';renderCloudBadge();
    return false;
  }
}

// Push a single record upsert to Supabase (fire-and-forget, non-blocking)
function pushPatient(p){
  if(!cloudSyncEnabled)return;
  sbFetch('patients?on_conflict=id',{method:'POST',headers:{'Prefer':'resolution=merge-duplicates,return=minimal'},body:JSON.stringify(patientToRow(p))})
    .then(()=>{cloudStatus='online';renderCloudBadge();})
    .catch((err)=>{console.error('pushPatient failed',err);cloudStatus='offline';renderCloudBadge();});
}
function pushAppt(a){
  if(!cloudSyncEnabled)return;
  sbFetch('appointments?on_conflict=id',{method:'POST',headers:{'Prefer':'resolution=merge-duplicates,return=minimal'},body:JSON.stringify(apptToRow(a))})
    .then(()=>{cloudStatus='online';renderCloudBadge();})
    .catch((err)=>{console.error('pushAppt failed',err);cloudStatus='offline';renderCloudBadge();});
}
function pushInvoice(i){
  if(!cloudSyncEnabled)return;
  sbFetch('invoices?on_conflict=id',{method:'POST',headers:{'Prefer':'resolution=merge-duplicates,return=minimal'},body:JSON.stringify(invoiceToRow(i))})
    .then(()=>{cloudStatus='online';renderCloudBadge();})
    .catch((err)=>{console.error('pushInvoice failed',err);cloudStatus='offline';renderCloudBadge();});
}
function pushDeletePatient(id){if(cloudSyncEnabled)sbFetch(`patients?id=eq.${id}`,{method:'DELETE'}).catch((err)=>console.error('delete patient failed',err));}
function pushDeleteAppt(id){if(cloudSyncEnabled)sbFetch(`appointments?id=eq.${id}`,{method:'DELETE'}).catch((err)=>console.error('delete appt failed',err));}
function pushDeleteInvoice(id){if(cloudSyncEnabled)sbFetch(`invoices?id=eq.${id}`,{method:'DELETE'}).catch((err)=>console.error('delete invoice failed',err));}
function pushConfig(){
  if(!cloudSyncEnabled)return;
  const rows=[
    {key:'next_patient_id',value:DB.nextId},
    {key:'next_appt_id',value:DB.nextAid},
    {key:'next_invoice_id',value:DB.nextInvId}
  ];
  sbFetch('app_config?on_conflict=key',{method:'POST',headers:{'Prefer':'resolution=merge-duplicates,return=minimal'},body:JSON.stringify(rows)}).catch((err)=>console.error('pushConfig failed',err));
}

// Push the ENTIRE current DB state (used after any save) — keeps it simple and consistent
function syncAllToCloud(){
  if(!cloudSyncEnabled)return;
  DB.patients.forEach(pushPatient);
  DB.appointments.forEach(pushAppt);
  DB.invoices.forEach(pushInvoice);
  pushConfig();
}

function renderCloudBadge(){
  const el=document.getElementById('cloudStatusBadge');
  const top=document.getElementById('cloudStatusBadgeTop');
  const map={
    connecting:{icon:'🔄',text:'Conectando…',color:'rgba(255,255,255,.5)',topColor:'var(--ink4)'},
    online:{icon:'☁️',text:'Sincronizado',color:'rgba(255,255,255,.6)',topColor:'var(--green-d)'},
    offline:{icon:'📴',text:'Sin conexión (local)',color:'#f5b8a0',topColor:'var(--red)'},
    error:{icon:'⚠️',text:'Error de sync',color:'#f5b8a0',topColor:'var(--red)'}
  };
  const s=map[cloudStatus]||map.connecting;
  if(el){el.innerHTML=`${s.icon} ${s.text}`;el.style.color=s.color;}
  if(top){top.textContent=s.icon;top.title=s.text;top.style.color=s.topColor;}
}

function daysUntil(ds){if(!ds)return null;const t=new Date();t.setHours(0,0,0,0);return Math.round((new Date(ds+'T12:00:00')-t)/86400000);}
function fmtDate(ds){if(!ds)return '—';return new Date(ds+'T12:00:00').toLocaleDateString('es-CL',{day:'2-digit',month:'short',year:'numeric'});}
function fmtDateLong(ds){if(!ds)return '—';return new Date(ds+'T12:00:00').toLocaleDateString('es-CL',{weekday:'long',day:'numeric',month:'long'});}
function todayStr(){return new Date().toISOString().split('T')[0];}
function fmtMoney(n){return '$'+Math.round(n).toLocaleString('es-CL');}
function invTotal(inv){return inv.items.reduce((s,i)=>s+(i.qty*i.price),0);}
function invDebt(inv){return Math.max(0,invTotal(inv)-inv.paid);}
function invStatus(inv){const t=invTotal(inv);if(inv.paid>=t)return 's-paid';if(inv.paid>0)return 's-partial';return 's-unpaid';}
function invStatusLabel(inv){const t=invTotal(inv);if(inv.paid>=t)return 'Pagado';if(inv.paid>0)return 'Pago parcial';return 'Pendiente';}

function getAlerts(){
  const out=[];
  DB.patients.forEach(p=>p.vaccinations.forEach(v=>{if(v.next){const d=daysUntil(v.next);if(d!==null&&d<=30)out.push({patient:p,vac:v,days:d});}}));
  return out.sort((a,b)=>a.days-b.days);
}
function getTodayApts(){return DB.appointments.filter(a=>a.date===todayStr()&&!a.done).sort((a,b)=>a.time.localeCompare(b.time));}
function getPendingDebt(){return DB.invoices.reduce((s,i)=>s+invDebt(i),0);}
function getUnpaidInvoices(){return DB.invoices.filter(i=>invDebt(i)>0).length;}

function alertClass(d){return d<=7?'ar-urgent':d<=14?'ar-warn':'ar-ok';}
function dotClass(d){return d<=7?'d-urgent':d<=14?'d-warn':'d-ok';}
function daysText(d){if(d<0)return `Vencida hace ${Math.abs(d)}d`;if(d===0)return 'Hoy';return `En ${d} días`;}
function daysCC(d){return d<=7?'days-urgent':d<=14?'days-warn':'days-ok';}
function vacSC(d){if(d===null)return 's-ok';if(d<0||d<=7)return 's-alert';if(d<=14)return 's-warn';return 's-ok';}
function vacST(d){if(d===null)return 'Sin fecha';if(d<0)return 'Vencida';if(d===0)return 'Hoy';return `${d}d`;}
function showToast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2500);}
function validEmail(e){return !e||/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(e);}
function checkEmail(id){const v=document.getElementById(id)?.value.trim();if(v&&!validEmail(v)){alert('El email ingresado no tiene un formato válido.\nEjemplo: correo@dominio.com');return false;}return true;}
const PHONE_PREFIX='+569';
function validPhone(p){
  if(!p)return true;
  const clean=p.replace(/\s+/g,'');
  if(clean===PHONE_PREFIX)return true; // solo el prefijo = campo sin completar, se trata como vacío
  return new RegExp('^\\'+PHONE_PREFIX+'\\d{8}$').test(clean);
}
function checkPhone(id){const v=document.getElementById(id)?.value.trim();if(v&&!validPhone(v)){alert('El teléfono debe tener 8 dígitos después de +569.\nEjemplo: +56912345678');return false;}return true;}
function sanitizePhoneInput(el){
  let v=el.value;
  if(!v.startsWith(PHONE_PREFIX)){
    let digits=v.replace(/\D/g,'');
    if(digits.startsWith('569'))digits=digits.slice(3);
    else if(digits.startsWith('56'))digits=digits.slice(2);
    else if(digits.startsWith('9'))digits=digits.slice(1);
    v=PHONE_PREFIX+digits;
  }
  const rest=v.slice(PHONE_PREFIX.length).replace(/\D/g,'').slice(0,8);
  el.value=PHONE_PREFIX+rest;
}
function guardPhoneKeydown(e){
  const el=e.target;
  if(e.key==='Backspace'||e.key==='Delete'){
    if(el.selectionStart<=PHONE_PREFIX.length&&el.selectionEnd<=PHONE_PREFIX.length){e.preventDefault();}
  }
}
function showPhoneHint(inputId,hintId){
  const inp=document.getElementById(inputId);const hint=document.getElementById(hintId);if(!inp||!hint)return;
  const v=inp.value.trim();
  if(!v||v==='+569'){hint.style.display='none';return;}
  const ok=validPhone(v);
  hint.style.display='';
  hint.textContent=ok?'✓ Formato correcto':'✗ Formato inválido (ej: +56 9 1234 5678)';
  hint.style.color=ok?'var(--green-d)':'var(--red)';
}
function showEmailHint(inputId,hintId){
  const inp=document.getElementById(inputId);const hint=document.getElementById(hintId);if(!inp||!hint)return;
  const v=inp.value.trim();
  if(!v){hint.style.display='none';return;}
  const ok=validEmail(v);
  hint.style.display='';
  hint.textContent=ok?'✓ Formato correcto':'✗ Formato inválido (ej: correo@dominio.com)';
  hint.style.color=ok?'var(--green-d)':'var(--red)';
}

// Patient address history: collect all unique addresses used in appointments
function getPatientAddresses(pid){
  const p=DB.patients.find(x=>x.id===pid);
  const stored=p&&p.addresses?[...p.addresses]:[];
  const fromApts=DB.appointments.filter(a=>a.patientId===pid&&a.address).map(a=>a.address);
  const all=[...new Set([...stored,...fromApts])];
  return all;
}

let view='dashboard',selectedPid=null,patientTab='historial',searchTerm='',agendaFilter='dia',billingFilter='todos',agendaDate=todayStr();
const VIEW_KEY='cmv_view_state';
function saveViewState(){
  try{localStorage.setItem(VIEW_KEY,JSON.stringify({view,selectedPid,patientTab,agendaFilter,billingFilter,agendaDate}));}catch(e){}
}
function restoreViewState(){
  try{
    const r=localStorage.getItem(VIEW_KEY);
    if(!r)return;
    const s=JSON.parse(r);
    if(s.view==='patient'&&!DB.patients.some(p=>p.id===s.selectedPid))return; // paciente ya no existe, quedarse en dashboard
    view=s.view||'dashboard';selectedPid=s.selectedPid??null;
    patientTab=s.patientTab||'historial';agendaFilter=(s.agendaFilter==='hoy'?'dia':s.agendaFilter)||'dia';billingFilter=s.billingFilter||'todos';agendaDate=s.agendaDate||todayStr();
    document.querySelectorAll('.nav-item').forEach(el=>el.classList.remove('active'));
    const key=view==='patient'?'patients':view;
    const el=document.getElementById('nav-'+key);if(el)el.classList.add('active');
  }catch(e){}
}

function nav(v,pid=null){
  view=v;selectedPid=pid;
  document.querySelectorAll('.nav-item').forEach(el=>el.classList.remove('active'));
  const key=v==='patient'?'patients':v;
  const el=document.getElementById('nav-'+key);if(el)el.classList.add('active');
  renderAll();
  closeSidebar();
  saveViewState();
}

  const c=document.getElementById('mainContent');

  else if(view==='patients') c.innerHTML=renderPatients();
  else if(view==='alerts')   c.innerHTML=renderAlertsView();
  else if(view==='agenda')   c.innerHTML=renderAgendaView();
  else if(view==='billing')  c.innerHTML=renderBillingView();
  else if(view==='patient')  c.innerHTML=renderPatientDetail();
}

function getBillingStats(){
  const now=new Date();
  const cy=now.getFullYear(),cm=now.getMonth();
  // This month
  const thisMonthInvs=DB.invoices.filter(i=>{const d=new Date(i.date+'T12:00:00');return d.getFullYear()===cy&&d.getMonth()===cm;});
  // Last month
  const lm=cm===0?11:cm-1;const ly=cm===0?cy-1:cy;
  const lastMonthInvs=DB.invoices.filter(i=>{const d=new Date(i.date+'T12:00:00');return d.getFullYear()===ly&&d.getMonth()===lm;});
  // Same month last year
  const sameMonthLY=DB.invoices.filter(i=>{const d=new Date(i.date+'T12:00:00');return d.getFullYear()===cy-1&&d.getMonth()===cm;});

  const sum=arr=>arr.reduce((s,i)=>s+invTotal(i),0);
  const paid=arr=>arr.reduce((s,i)=>s+i.paid,0);
  const debt=arr=>arr.reduce((s,i)=>s+invDebt(i),0);

  // Weekly breakdown of current month
  const weeks=[0,0,0,0,0];
  const weeksPaid=[0,0,0,0,0];
  thisMonthInvs.forEach(i=>{
    const day=new Date(i.date+'T12:00:00').getDate();
    const wk=Math.min(Math.floor((day-1)/7),4);
    weeks[wk]+=invTotal(i);
    weeksPaid[wk]+=i.paid;
  });

  return {thisMonth:{invs:thisMonthInvs,total:sum(thisMonthInvs),paid:paid(thisMonthInvs),debt:debt(thisMonthInvs)},
          lastMonth:{total:sum(lastMonthInvs)},
          sameMonthLY:{total:sum(sameMonthLY)},
          weeks,weeksPaid};
}

function renderBillingView(){
  const now=new Date();
  const monthNames=['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
  const curMonthName=monthNames[now.getMonth()];
  const lmIdx=now.getMonth()===0?11:now.getMonth()-1;
  const lastMonthName=monthNames[lmIdx];
  const stats=getBillingStats();
  const maxWeek=Math.max(...stats.weeks,1);

  let invs=[...DB.invoices];
  if(billingFilter==='pendientes') invs=invs.filter(i=>invDebt(i)>0);
  else if(billingFilter==='pagados') invs=invs.filter(i=>invDebt(i)===0);
  else if(billingFilter==='mes') invs=invs.filter(i=>{const d=new Date(i.date+'T12:00:00');return d.getFullYear()===now.getFullYear()&&d.getMonth()===now.getMonth();});
  invs.sort((a,b)=>b.date.localeCompare(a.date));

  const totalFacturado=DB.invoices.reduce((s,i)=>s+invTotal(i),0);
  const totalCobrado=DB.invoices.reduce((s,i)=>s+i.paid,0);
  const totalDeuda=DB.invoices.reduce((s,i)=>s+invDebt(i),0);

  // Bar chart SVG for weekly breakdown
  const barW=60,gap=18,chartH=120,padL=52,padB=28,padT=10;
  const totalW=padL+(barW+gap)*5+gap;
  const barColors=['#1e8fa0','#1e8fa0','#1e8fa0','#1e8fa0','#1e8fa0'];
  const paidColors=['#1a9e78','#1a9e78','#1a9e78','#1a9e78','#1a9e78'];
  const labels=['Sem 1','Sem 2','Sem 3','Sem 4','Sem 5'];
  const yTicks=4;

  let bars='';
  for(let i=0;i<5;i++){
    const x=padL+i*(barW+gap)+gap/2;
    const totalH=Math.round((stats.weeks[i]/maxWeek)*chartH);
    const paidH=Math.round((stats.weeksPaid[i]/maxWeek)*chartH);
    const debtH=totalH-paidH;
    const y=padT+chartH-totalH;
    const yPaid=padT+chartH-paidH;
    if(stats.weeks[i]>0){
      // debt bar (bottom part = paid, top = debt stacked)
      if(debtH>0) bars+=`<rect x="${x}" y="${padT+chartH-totalH}" width="${barW}" height="${debtH}" fill="#f5b8a0" rx="3"/>`;
      if(paidH>0) bars+=`<rect x="${x}" y="${padT+chartH-paidH}" width="${barW}" height="${paidH}" fill="#1a9e78" rx="3"/>`;
      bars+=`<text x="${x+barW/2}" y="${padT+chartH-totalH-4}" text-anchor="middle" font-size="10" fill="#136273" font-family="DM Sans,sans-serif" font-weight="600">${fmtMoney(stats.weeks[i]).replace('$','')}</text>`;
    } else {
      bars+=`<rect x="${x}" y="${padT+chartH-2}" width="${barW}" height="2" fill="#dedad3" rx="1"/>`;
    }
    bars+=`<text x="${x+barW/2}" y="${padT+chartH+padB-8}" text-anchor="middle" font-size="10" fill="#9ba3aa" font-family="DM Sans,sans-serif">${labels[i]}</text>`;
  }
  // Y axis ticks
  let yAxis='';
  for(let t=0;t<=yTicks;t++){
    const yy=padT+chartH-Math.round((t/yTicks)*chartH);
    const val=Math.round((t/yTicks)*maxWeek);
    yAxis+=`<line x1="${padL}" y1="${yy}" x2="${padL+(barW+gap)*5+gap}" y2="${yy}" stroke="#eceae4" stroke-width="1"/>`;
    if(t>0) yAxis+=`<text x="${padL-5}" y="${yy+4}" text-anchor="end" font-size="9" fill="#9ba3aa" font-family="DM Sans,sans-serif">${val>=1000?(val/1000).toFixed(0)+'k':val}</text>`;
  }

  const chartSVG=`<svg viewBox="0 0 ${totalW} ${chartH+padT+padB}" style="width:100%;min-width:${totalW}px;height:${chartH+padT+padB}px;display:block;">
    ${yAxis}${bars}
    <line x1="${padL}" y1="${padT}" x2="${padL}" y2="${padT+chartH}" stroke="#dedad3" stroke-width="1"/>
  </svg>`;

  // ── Annual chart: last 12 months ──────────────────────────────────────────
  const annualMonths=[];
  for(let i=11;i>=0;i--){
    const d=new Date(now.getFullYear(),now.getMonth()-i,1);
    const y=d.getFullYear(),m=d.getMonth();
    const mInvs=DB.invoices.filter(inv=>{const dd=new Date(inv.date+'T12:00:00');return dd.getFullYear()===y&&dd.getMonth()===m;});
    const total=mInvs.reduce((s,inv)=>s+invTotal(inv),0);
    const paid=mInvs.reduce((s,inv)=>s+inv.paid,0);
    annualMonths.push({label:monthNames[m].slice(0,3),year:y,total,paid,debt:total-paid});
  }
  const maxAnnual=Math.max(...annualMonths.map(m=>m.total),1);
  const aBarW=38,aGap=10,aChartH=130,aPadL=52,aPadB=32,aPadT=14;
  const aTotalW=aPadL+(aBarW+aGap)*12+aGap;
  let aBars='',aYAxis='';
  const aYTicks=4;
  for(let t=0;t<=aYTicks;t++){
    const yy=aPadT+aChartH-Math.round((t/aYTicks)*aChartH);
    const val=Math.round((t/aYTicks)*maxAnnual);
    aYAxis+=`<line x1="${aPadL}" y1="${yy}" x2="${aTotalW}" y2="${yy}" stroke="#eceae4" stroke-width="1"/>`;
    if(t>0) aYAxis+=`<text x="${aPadL-5}" y="${yy+4}" text-anchor="end" font-size="9" fill="#9ba3aa" font-family="DM Sans,sans-serif">${val>=1000?(val/1000).toFixed(0)+'k':val}</text>`;
  }
  annualMonths.forEach((m,i)=>{
    const x=aPadL+i*(aBarW+aGap)+aGap/2;
    const tH=Math.round((m.total/maxAnnual)*aChartH);
    const pH=Math.round((m.paid/maxAnnual)*aChartH);
    const dH=tH-pH;
    const isCur=(i===11);
    if(m.total>0){
      if(dH>0) aBars+=`<rect x="${x}" y="${aPadT+aChartH-tH}" width="${aBarW}" height="${dH}" fill="${isCur?'#f5b8a0':'#f5d4c0'}" rx="3"/>`;
      if(pH>0) aBars+=`<rect x="${x}" y="${aPadT+aChartH-pH}" width="${aBarW}" height="${pH}" fill="${isCur?'#1a9e78':'#8fd4c0'}" rx="3"/>`;
      const displayVal=m.total>=1000?(m.total/1000).toFixed(0)+'k':m.total;
      aBars+=`<text x="${x+aBarW/2}" y="${aPadT+aChartH-tH-4}" text-anchor="middle" font-size="9" fill="${isCur?'#136273':'#9ba3aa'}" font-family="DM Sans,sans-serif" font-weight="${isCur?'700':'400'}">${displayVal}</text>`;
    } else {
      aBars+=`<rect x="${x}" y="${aPadT+aChartH-2}" width="${aBarW}" height="2" fill="#eceae4" rx="1"/>`;
    }
    // Label: month + year change indicator
    const showYear=(i===0)||(i>0&&annualMonths[i-1].year!==m.year);
    aBars+=`<text x="${x+aBarW/2}" y="${aPadT+aChartH+14}" text-anchor="middle" font-size="9" fill="${isCur?'var(--teal-d)':'#9ba3aa'}" font-family="DM Sans,sans-serif" font-weight="${isCur?'700':'400'}">${m.label}</text>`;
    if(showYear) aBars+=`<text x="${x+aBarW/2}" y="${aPadT+aChartH+26}" text-anchor="middle" font-size="8" fill="#c0c0b8" font-family="DM Sans,sans-serif">${m.year}</text>`;
  });
  const annualTotalFact=annualMonths.reduce((s,m)=>s+m.total,0);
  const annualTotalPaid=annualMonths.reduce((s,m)=>s+m.paid,0);
  const annualTotalDebt=annualMonths.reduce((s,m)=>s+m.debt,0);
  const annualChartSVG=`<div class="card" style="margin-bottom:14px;">
    <div class="card-header">
      <span class="card-title">Facturación mensual — últimos 12 meses</span>
      <div style="display:flex;gap:12px;align-items:center;font-size:12px;">
        <span style="display:inline-flex;align-items:center;gap:5px;"><span style="width:10px;height:10px;border-radius:2px;background:#8fd4c0;display:inline-block;"></span>Cobrado</span>
        <span style="display:inline-flex;align-items:center;gap:5px;"><span style="width:10px;height:10px;border-radius:2px;background:#f5d4c0;display:inline-block;"></span>Pendiente</span>
        <span style="display:inline-flex;align-items:center;gap:5px;"><span style="width:10px;height:10px;border-radius:2px;background:#1a9e78;display:inline-block;"></span>Mes actual</span>
      </div>
    </div>
    <div style="padding:16px 20px 8px;overflow-x:auto;">
      <svg viewBox="0 0 ${aTotalW} ${aChartH+aPadT+aPadB}" style="width:100%;min-width:400px;height:${aChartH+aPadT+aPadB}px;display:block;">
        ${aYAxis}${aBars}
        <line x1="${aPadL}" y1="${aPadT}" x2="${aPadL}" y2="${aPadT+aChartH}" stroke="#dedad3" stroke-width="1"/>
      </svg>
    </div>
    <div style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:0;border-top:1px solid var(--border);">
      <div style="padding:11px 18px;border-right:1px solid var(--border);">
        <div style="font-size:11px;color:var(--ink4);margin-bottom:3px;">FACTURADO 12 MESES</div>
        <div style="font-size:17px;font-weight:600;color:var(--teal-d);">${fmtMoney(annualTotalFact)}</div>
      </div>
      <div style="padding:11px 18px;border-right:1px solid var(--border);">
        <div style="font-size:11px;color:var(--ink4);margin-bottom:3px;">COBRADO</div>
        <div style="font-size:17px;font-weight:600;color:var(--green-d);">${fmtMoney(annualTotalPaid)}</div>
      </div>
      <div style="padding:11px 18px;">
        <div style="font-size:11px;color:var(--ink4);margin-bottom:3px;">SALDO PENDIENTE</div>
        <div style="font-size:17px;font-weight:600;color:${annualTotalDebt>0?'var(--red)':'var(--green-d)'};">${fmtMoney(annualTotalDebt)}</div>
      </div>
    </div>
  </div>`;

  return `<div style="max-width:960px;">
    <!-- Tarjetas resumen mes -->
    <div style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin-bottom:18px;">
      <div style="background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:20px 22px;box-shadow:var(--shadow);border-top:4px solid var(--ink4);">
        <div style="font-size:12px;font-weight:600;color:var(--ink4);letter-spacing:.04em;text-transform:uppercase;margin-bottom:6px;">${lastMonthName} ${lmIdx>now.getMonth()?now.getFullYear()-1:now.getFullYear()}</div>
        <div style="font-family:'DM Serif Display',serif;font-size:32px;color:var(--ink);line-height:1;">${fmtMoney(stats.lastMonth.total)}</div>
        <div style="font-size:12px;color:var(--ink4);margin-top:5px;">Facturado mes anterior</div>
      </div>
      <div style="background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:20px 22px;box-shadow:var(--shadow);border-top:4px solid var(--teal);">
        <div style="font-size:12px;font-weight:600;color:var(--teal-d);letter-spacing:.04em;text-transform:uppercase;margin-bottom:6px;">${curMonthName} ${now.getFullYear()} — Este mes</div>
        <div style="font-family:'DM Serif Display',serif;font-size:32px;color:var(--teal-d);line-height:1;">${fmtMoney(stats.thisMonth.total)}</div>
        <div style="font-size:12px;color:var(--ink4);margin-top:5px;">${stats.thisMonth.invs.length} cobro${stats.thisMonth.invs.length!==1?'s':''} · cobrado ${fmtMoney(stats.thisMonth.paid)}</div>
      </div>
      <div style="background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:20px 22px;box-shadow:var(--shadow);border-top:4px solid ${stats.thisMonth.debt>0?'var(--red)':'var(--green)'};">
        <div style="font-size:12px;font-weight:600;color:${stats.thisMonth.debt>0?'var(--red)':'var(--green-d)'};letter-spacing:.04em;text-transform:uppercase;margin-bottom:6px;">Pendiente ${curMonthName}</div>
        <div style="font-family:'DM Serif Display',serif;font-size:32px;color:${stats.thisMonth.debt>0?'var(--red)':'var(--green-d)'};line-height:1;">${fmtMoney(stats.thisMonth.debt)}</div>
        <div style="font-size:12px;color:var(--ink4);margin-top:5px;">${stats.thisMonth.debt>0?'por cobrar este mes':'todo al día 🎉'}</div>
      </div>
    </div>

    <!-- Nuevo cobro -->
    <div style="display:flex;justify-content:flex-end;margin-bottom:16px;">
      <button class="btn btn-teal btn-sm" onclick="openNewInvoiceModal()">+ Nuevo cobro</button>
    </div>

    <!-- Chart card semana actual -->
    <div class="card" style="margin-bottom:14px;">
      <div class="card-header">
        <span class="card-title">Facturación por semana — ${curMonthName} ${now.getFullYear()}</span>
        <div style="display:flex;gap:12px;align-items:center;font-size:12px;">
          <span style="display:inline-flex;align-items:center;gap:5px;"><span style="width:10px;height:10px;border-radius:2px;background:#1a9e78;display:inline-block;"></span>Cobrado</span>
          <span style="display:inline-flex;align-items:center;gap:5px;"><span style="width:10px;height:10px;border-radius:2px;background:#f5b8a0;display:inline-block;"></span>Pendiente</span>
        </div>
      </div>
      <div style="padding:16px 20px 8px;overflow-x:auto;">${chartSVG}</div>
      <div style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:0;border-top:1px solid var(--border);">
        <div style="padding:12px 18px;border-right:1px solid var(--border);">
          <div style="font-size:11px;color:var(--ink4);margin-bottom:3px;">FACTURADO ${curMonthName.toUpperCase()}</div>
          <div style="font-size:18px;font-weight:600;color:var(--teal-d);">${fmtMoney(stats.thisMonth.total)}</div>
        </div>
        <div style="padding:12px 18px;border-right:1px solid var(--border);">
          <div style="font-size:11px;color:var(--ink4);margin-bottom:3px;">COBRADO</div>
          <div style="font-size:18px;font-weight:600;color:var(--green-d);">${fmtMoney(stats.thisMonth.paid)}</div>
        </div>
        <div style="padding:12px 18px;">
          <div style="font-size:11px;color:var(--ink4);margin-bottom:3px;">SALDO PENDIENTE</div>
          <div style="font-size:18px;font-weight:600;color:${stats.thisMonth.debt>0?'var(--red)':'var(--green-d)'};">${fmtMoney(stats.thisMonth.debt)}</div>
        </div>
      </div>
    </div>

    <!-- Chart card: facturación mensual últimos 12 meses -->
    ${annualChartSVG}

    ${invs.length===0?`<div class="card card-p"><div class="empty"><div class="empty-icon">💰</div><div class="empty-text">Sin cobros en esta categoría</div></div></div>`:
    invs.map(inv=>{
      const total=invTotal(inv);const debt=invDebt(inv);
      const pat=DB.patients.find(p=>p.id===inv.patientId);
      const emoji=pat?EMOJIS[pat.species]:'🐾';
      return `<div class="bill-card">
        <div class="bill-header">
          <div style="flex:1;">
            <div class="bill-patient">${emoji} ${inv.patient}</div>
            <div class="bill-tutor">${inv.tutor} · ${inv.phone||''} · ${fmtDate(inv.date)}</div>
          </div>
          <span class="status ${invStatus(inv)}">${invStatusLabel(inv)}</span>
          <button class="btn btn-sm" onclick="openEditInvoiceModal(${inv.id})" style="font-size:11px;margin-left:8px;">✏ Editar</button>
          <button class="btn btn-sm btn-danger" onclick="deleteInvoice(${inv.id})" style="font-size:11px;margin-left:4px;">✕</button>
        </div>
        <table class="bill-items-table">
          <thead><tr><th>Ítem</th><th style="text-align:center;">Cant.</th><th style="text-align:right;">Precio unit.</th><th style="text-align:right;">Subtotal</th></tr></thead>
          <tbody>${inv.items.map(item=>`<tr><td>${item.desc}</td><td style="text-align:center;">${item.qty}</td><td style="text-align:right;">${fmtMoney(item.price)}</td><td style="text-align:right;font-weight:500;">${fmtMoney(item.qty*item.price)}</td></tr>`).join('')}</tbody>
        </table>
        <div class="bill-total">
          <div>
            <div class="paid-amount">Pagado: ${fmtMoney(inv.paid)}</div>
            ${debt>0?`<div class="debt-amount">Saldo: ${fmtMoney(debt)}</div>`:''}
            ${inv.notes?`<div style="font-size:12px;color:var(--ink4);margin-top:2px;font-style:italic;">${inv.notes}</div>`:''}
          </div>
          <div style="text-align:right;">
            <div class="bill-total-label">TOTAL</div>
            <div class="bill-total-amount">${fmtMoney(total)}</div>
            ${debt>0?`<button class="btn btn-green btn-sm" onclick="openPayModal(${inv.id})" style="margin-top:6px;font-size:11px;">💳 Registrar pago</button>`:''}
          </div>
        </div>
      </div>`;
    }).join('')}
  </div>`;
}

function switchTab(t){patientTab=t;renderMain();saveViewState();}
function renderPatientDetail(){
  const p=DB.patients.find(x=>x.id===selectedPid);if(!p)return '';
  const history=[...(p.history||[])].reverse();
  const vaccs=p.vaccinations||[];
  const allA=p.vaccinations.filter(v=>v.next&&daysUntil(v.next)<=14);
  const patInvoices=DB.invoices.filter(i=>i.patientId===p.id);
  const patDebt=patInvoices.reduce((s,i)=>s+invDebt(i),0);

  const histHTML=`<div class="section-heading"><span class="section-title">Historial (${history.length})</span>
    <button class="btn btn-teal btn-sm" onclick="openNewVisitModal(${p.id})">+ Nueva consulta</button></div>
    ${history.length===0?'<div class="empty"><div class="empty-icon">📋</div><div class="empty-text">Sin consultas</div></div>':
    history.map(h=>`<div class="history-card">
      <div class="hc-header"><span class="hc-date">${fmtDate(h.date)}</span>
      <button class="btn btn-xs btn-danger" onclick="deleteVisit(${p.id},${h.id})">✕</button></div>
      <div class="hc-motivo">${h.motivo}</div>
      ${h.notas?`<div class="hc-notes">${h.notas}</div>`:''}
      ${h.peso||h.temp?`<div class="hc-vitals">${h.peso?`<span class="vital">⚖️ ${h.peso} kg</span>`:''}${h.temp?`<span class="vital">🌡️ ${h.temp}°C</span>`:''}</div>`:''}
    </div>`).join('')}`;

  const vacHTML=`<div class="section-heading"><span class="section-title">Vacunas (${vaccs.length})</span>
    <button class="btn btn-teal btn-sm" onclick="openNewVaccineModal(${p.id})">+ Agregar</button></div>
    ${vaccs.length===0?'<div class="empty"><div class="empty-icon">💉</div><div class="empty-text">Sin vacunas</div></div>':
    `<div class="card">${vaccs.map((v,i)=>{const d=daysUntil(v.next);
      return `<div class="vac-row" style="${i===0?'padding-top:8px':''}">
        <div style="flex:1;"><div style="font-size:14px;font-weight:600;">${v.name}</div>
        <div style="font-size:12px;color:var(--ink4);">Aplicada: ${fmtDate(v.date)} · Próxima: ${fmtDate(v.next)}</div></div>
        ${v.next?`<span class="status ${vacSC(d)}">${vacST(d)}</span>`:''}
        <button class="btn btn-sm" onclick="openEditVaccineModal(${p.id},${i})" style="font-size:11px;">Editar</button>
        <button class="btn btn-xs btn-danger" onclick="deleteVaccine(${p.id},${i})">✕</button>
      </div>`;
    }).join('')}</div>`}`;

  const cobrosHTML=`<div class="section-heading"><span class="section-title">Cobros (${patInvoices.length})</span>
    <button class="btn btn-teal btn-sm" onclick="openNewInvoiceModal(${p.id})">+ Nuevo cobro</button></div>
    ${patInvoices.length===0?'<div class="empty"><div class="empty-icon">💰</div><div class="empty-text">Sin cobros registrados</div></div>':
    patInvoices.sort((a,b)=>b.date.localeCompare(a.date)).map(inv=>{
      const total=invTotal(inv);const debt=invDebt(inv);
      return `<div class="bill-card">
        <div class="bill-header">
          <div style="flex:1;"><div style="font-size:13px;font-weight:600;">${fmtDate(inv.date)}</div>
          <div style="font-size:12px;color:var(--ink4);">${inv.items.length} ítem${inv.items.length>1?'s':''}</div></div>
          <span class="status ${invStatus(inv)}">${invStatusLabel(inv)}</span>
          <button class="btn btn-sm" onclick="openEditInvoiceModal(${inv.id})" style="font-size:11px;margin-left:8px;">✏</button>
        </div>
        <div style="display:flex;justify-content:space-between;align-items:center;font-size:13px;">
          <span style="color:var(--ink3);">Total: <b>${fmtMoney(total)}</b> · Pagado: <span style="color:var(--green-d);">${fmtMoney(inv.paid)}</span></span>
          ${debt>0?`<span style="color:var(--red);font-weight:600;">Saldo: ${fmtMoney(debt)}</span>`:''}
        </div>
        ${debt>0?`<div style="margin-top:8px;"><button class="btn btn-green btn-sm" onclick="openPayModal(${inv.id})" style="font-size:11px;">💳 Registrar pago</button></div>`:''}
      </div>`;
    }).join('')}`;

  return `<div style="max-width:840px;">
    <span class="back-link" onclick="nav('patients')">← Volver a pacientes</span>
    <div class="detail-wrap">
      <div class="profile-hero">
      <div class="avatar-wrap">
        <div class="hero-avatar ${p.photo?'hero-avatar-clickable':''}" style="background:${p.color}22;" ${p.photo?`onclick="openPhotoLightbox(${p.id})" title="Ver foto más grande"`:''}>
          ${p.photo?`<img src="${p.photo}" alt="${p.name}"/>`:`<span style="font-size:26px;">${EMOJIS[p.species]}</span>`}
        </div>
        <button class="avatar-edit-btn" onclick="triggerPhotoUpload(${p.id})" title="Cambiar foto">📷</button>
      </div>
      <input type="file" id="photoInput_${p.id}" accept="image/*" style="display:none;" onchange="handlePhotoUpload(event,${p.id})"/>
        <div style="flex:1;">
          <div class="hero-name">${p.name}</div>
          <div class="hero-meta">${SPECIES_ES[p.species]} · ${p.breed||'Sin raza'} · ${p.age} año${p.age!=1?'s':''}</div>
          <div class="hero-meta">Tutor: <b>${p.tutor}</b> · ${p.phone||'Sin teléfono'}</div>
        </div>
        <div style="display:flex;flex-direction:column;align-items:flex-end;gap:6px;">
          ${allA.length>0?`<span class="status s-alert">⚠ ${allA.length} vac. por vencer</span>`:'<span class="status s-ok">Vacunas al día</span>'}
          ${patDebt>0?`<span class="status s-unpaid">Deuda: ${fmtMoney(patDebt)}</span>`:''}
        </div>
        <button class="btn btn-sm" onclick="openEditPatientModal(${p.id})" style="margin-left:8px;">✏ Editar</button>
      </div>
      <div class="info-chips">
        <div class="chip"><div class="chip-label">Peso</div><div class="chip-value">${p.weight} kg</div></div>
        <div class="chip"><div class="chip-label">Edad</div><div class="chip-value">${p.age} años</div></div>
        <div class="chip"><div class="chip-label">Teléfono</div><div class="chip-value">${p.phone||'—'}</div></div>
        <div class="chip"><div class="chip-label">Email</div><div class="chip-value">${p.email||'—'}</div></div>
        <div class="chip"><div class="chip-label">Consultas</div><div class="chip-value">${p.history.length}</div></div>
        <div class="chip"><div class="chip-label">Vacunas</div><div class="chip-value">${p.vaccinations.length}</div></div>
      </div>
      <div class="tab-bar">
        <div class="tab ${patientTab==='historial'?'active':''}" onclick="switchTab('historial')">📋 Historial</div>
        <div class="tab ${patientTab==='vacunas'?'active':''}" onclick="switchTab('vacunas')">💉 Vacunas</div>
        <div class="tab ${patientTab==='cobros'?'active':''}" onclick="switchTab('cobros')">💰 Cobros${patDebt>0?` <span style="color:var(--red);font-size:11px;">(${fmtMoney(patDebt)})</span>`:''}</div>
      </div>
      <div class="tab-content">
        ${patientTab==='historial'?histHTML:patientTab==='vacunas'?vacHTML:cobrosHTML}
      </div>
    </div>
  </div>`;
}

function handlePhotoUpload(event,pid){

  const reader=new FileReader();
  reader.onload=function(e){

// Patient name autocomplete
function patientAC(){
  const inp=document.getElementById('a-patient');const ac=document.getElementById('a-ac');if(!inp||!ac)return;
  const v=inp.value.toLowerCase().trim();
  const matches=v===''?DB.patients:DB.patients.filter(p=>p.name.toLowerCase().includes(v)||p.tutor.toLowerCase().includes(v));
  if(!matches.length){ac.classList.remove('open');return;}
  ac.classList.add('open');
  ac.innerHTML=matches.slice(0,8).map(p=>`<div class="autocomplete-item" onmousedown="fillPatient(${p.id})">${EMOJIS[p.species]} <b>${p.name}</b> <span style="color:var(--ink4);">— ${p.tutor}</span></div>`).join('');
}
function closeAC(){const ac=document.getElementById('a-ac');if(ac)ac.classList.remove('open');}
function fillPatient(pid){
  const p=DB.patients.find(x=>x.id===pid);if(!p)return;
  const inp=document.getElementById('a-patient');
  if(inp){inp.value=p.name;inp._pid=pid;}
  const acEl=document.getElementById('a-ac');if(acEl)acEl.classList.remove('open');
  const t=document.getElementById('a-tutor');if(t)t.value=p.tutor;
  const ph=document.getElementById('a-phone');if(ph)ph.value=p.phone||'+569';
  // Auto-fill first known address
  const addrs=getPatientAddresses(pid);
  const addrInp=document.getElementById('a-address');
  if(addrInp&&addrs.length>0&&!addrInp.value)addrInp.value=addrs[0];
  // Refresh address dropdown
  addressAC();
}

// Address autocomplete based on selected patient
function addressAC(){
  const patInp=document.getElementById('a-patient');
  const addrInp=document.getElementById('a-address');
  const ac=document.getElementById('a-addr-ac');
  if(!addrInp||!ac)return;
  // Get pid from stored property or search by name
  let pid=patInp&&patInp._pid?patInp._pid:null;
  if(!pid&&patInp){const nm=patInp.value.toLowerCase().trim();const pp=DB.patients.find(p=>p.name.toLowerCase()===nm);if(pp)pid=pp.id;}
  // Collect addresses: from patient record + from past appointments
  const allAddrs=pid?getPatientAddresses(pid):[];
  const typed=addrInp.value.toLowerCase().trim();
  const filtered=typed===''?allAddrs:allAddrs.filter(a=>a.toLowerCase().includes(typed));
  if(!filtered.length){ac.classList.remove('open');return;}
  ac.classList.add('open');
  ac.innerHTML=filtered.map(a=>`<div class="autocomplete-item" onmousedown="fillAddress('${a.replace(/'/g,"\\'")}')">📍 ${a}</div>`).join('');
}
function closeAddrAC(){const ac=document.getElementById('a-addr-ac');if(ac)ac.classList.remove('open');}
function fillAddress(addr){
  const inp=document.getElementById('a-address');if(inp)inp.value=addr;
  const ac=document.getElementById('a-addr-ac');if(ac)ac.classList.remove('open');
}

function saveNewAppt(){
  const date=document.getElementById('a-date').value;
  const time=document.getElementById('a-time').value;
  const patInp=document.getElementById('a-patient');
  const patient=patInp.value.trim();
  const address=document.getElementById('a-address').value.trim();
  const motivo=document.getElementById('a-motivo').value.trim();
  if(!date||!time){alert('Fecha y hora son obligatorias.');return;}
  if(!patient){alert('El nombre del paciente es obligatorio.');return;}
  if(!motivo){alert('El motivo es obligatorio.');return;}
  // find patientId
  let pid=patInp._pid||null;
  if(!pid){const pp=DB.patients.find(p=>p.name.toLowerCase()===patient.toLowerCase());if(pp)pid=pp.id;}
  // save new address to patient record if not already stored
  if(pid&&address){
    const p=DB.patients.find(x=>x.id===pid);
    if(p&&!(p.addresses||[]).includes(address)){if(!p.addresses)p.addresses=[];p.addresses.push(address);}
  }
  DB.appointments.push({id:DB.nextAid++,date,time,patientId:pid||null,patient,
    tutor:document.getElementById('a-tutor').value.trim(),
    phone:document.getElementById('a-phone').value.trim(),
    address,motivo,notes:document.getElementById('a-notes').value.trim(),done:false});
  saveDB();closeModal();showToast('Cita agendada ✓');agendaDate=date;agendaFilter='dia';nav('agenda');
}

    <div class="hr"></div>
    <div class="form-row">
      <div class="form-group"><label>Monto pagado ($)</label><input id="inv-paid" type="number" min="0" step="100" placeholder="0"/></div>
    </div>
    <div class="form-group"><label>Notas</label><textarea id="inv-notes" style="min-height:50px;" placeholder="Efectivo, transferencia, observaciones…"></textarea></div>
    <div class="modal-footer">
      <button class="btn" onclick="closeModal()">Omitir cobro</button>
      <button class="btn btn-teal" onclick="savePostApptInvoice(${pid||'null'},'${a.patient}','${(a.tutor||'').replace(/'/g,"\\'")}','${(a.phone||'').replace(/'/g,"\\'")}')">Guardar cobro</button>
    </div>
  </div>`);
  // Store pid on input for AC
  setTimeout(()=>{const inp=document.getElementById('inv-patient');if(inp&&pid)inp._pid=pid;},50);
  renderInvItems();
}

function savePostApptInvoice(pid,patient,tutor,phone){
  const validItems=editItems.filter(i=>i.desc.trim()&&i.price>0);
  if(!validItems.length){
    if(!confirm('No has ingresado ítems con precio. ¿Cerrar sin guardar cobro?'))return;
    closeModal();renderAll();return;
  }
  const pidNum=pid&&pid!=='null'?+pid:null;
  const newInv={
    id:DB.nextInvId++,
    date:document.getElementById('inv-date').value||todayStr(),
    patientId:pidNum,patient,
    tutor:document.getElementById('inv-tutor').value.trim()||tutor,
    phone:document.getElementById('inv-phone').value.trim()||phone,
    items:validItems.map(i=>({desc:i.desc.trim(),qty:+i.qty||1,price:+i.price||0})),
    paid:+(document.getElementById('inv-paid').value)||0,
    notes:document.getElementById('inv-notes').value.trim()
  };
  DB.invoices.push(newInv);
  // Link invoice to appointment so we can edit it later from agenda
  const apptId=window._currentApptId||null;
  if(apptId){const apt=DB.appointments.find(x=>x.id===apptId);if(apt)apt.invoiceId=newInv.id;}
  saveDB();closeModal();showToast('Cita y cobro registrados ✓');billingFilter='todos';renderAll();
}
function deleteAppt(aid){if(!confirm('¿Eliminar esta cita?'))return;DB.appointments=DB.appointments.filter(x=>x.id!==aid);saveDB();pushDeleteAppt(aid);showToast('Eliminada');closeModal();renderAll();}

// ══════════════════════════════════════════════════════
//  INVOICE MODALS
// ══════════════════════════════════════════════════════
let editItems=[];

function openNewInvoiceModal(prefillPid){
  const pp=prefillPid?DB.patients.find(x=>x.id===prefillPid):null;
  editItems=[{desc:'',qty:1,price:0}];
  openModal(`<div class="modal modal-lg">
    <div class="modal-title">Nuevo cobro</div>
    <div class="form-group">
      <label>Paciente *</label>
      <input id="inv-patient" type="text" placeholder="Nombre del animal…" value="${pp?pp.name:''}" oninput="invPatientAC()" onfocus="invPatientAC()" onblur="setTimeout(closeInvAC,200)" autocomplete="off"/>
      <div id="inv-ac" class="autocomplete-list"></div>
    </div>
    <div class="form-row">
      <div class="form-group"><label>Tutor</label><input id="inv-tutor" type="text" value="${pp?pp.tutor:''}"/></div>
      <div class="form-group"><label>Teléfono</label><input id="inv-phone" type="tel" value="${pp&&pp.phone?pp.phone:'+569'}" placeholder="+56 9 1234 5678" oninput="sanitizePhoneInput(this)" onkeydown="guardPhoneKeydown(event)"/></div>
    </div>
    <div class="form-group"><label>Fecha *</label><input id="inv-date" type="date" value="${todayStr()}" style="width:180px;"/></div>
    <div class="hr"></div>
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;">
      <div class="section-title">ÍTEMS</div>
      <div id="inv-total-preview" style="font-size:16px;font-weight:600;color:var(--teal-d);"></div>
    </div>
    <div id="inv-items-wrap"></div>
    <button class="add-item-btn" onclick="addInvItem()">+ Agregar ítem</button>
    <div class="hr"></div>
    <div class="form-row">
      <div class="form-group"><label>Monto pagado ($)</label><input id="inv-paid" type="number" min="0" step="100" placeholder="0"/></div>
    </div>
    <div class="form-group"><label>Notas</label><textarea id="inv-notes" style="min-height:50px;" placeholder="Observaciones, acuerdos de pago…"></textarea></div>
    <div class="modal-footer">
      <button class="btn" onclick="closeModal()">Cancelar</button>
      <button class="btn btn-teal" onclick="saveNewInvoice()">Guardar cobro</button>
    </div>
  </div>`);
  if(pp){setTimeout(()=>{document.getElementById('inv-patient')._pid=pp.id;},50);}
  renderInvItems();
}

function renderInvItems(){
  const wrap=document.getElementById('inv-items-wrap');if(!wrap)return;
  // Build grouped optgroup options
  const groupOpts='<option value="">— Seleccionar del catálogo —</option>'+
    TARIFAS.map(cat=>`<optgroup label="${cat.cat}">`+
      cat.items.map(it=>`<option value="${it.desc}|${it.price}">${it.desc} — $${it.price.toLocaleString('es-CL')}</option>`).join('')+
    '</optgroup>').join('');

  wrap.innerHTML=editItems.map((item,i)=>`
    <div style="margin-bottom:10px;padding:10px 12px;background:var(--bg);border:1px solid var(--border);border-radius:9px;">
      <div style="display:flex;gap:6px;align-items:center;margin-bottom:6px;">
        <select style="flex:1;min-width:0;font-size:12px;padding:6px 8px;" onchange="selectTarifa(${i},this.value);this.selectedIndex=0;">
          ${groupOpts}
        </select>
        <button class="btn btn-xs btn-danger" onclick="removeItem(${i})" ${editItems.length===1?'disabled':''} style="flex-shrink:0;">✕</button>
      </div>
      <div style="display:flex;gap:6px;align-items:center;">
        <input type="text" placeholder="O escribe descripción personalizada…" value="${item.desc.replace(/"/g,'&quot;')}" oninput="updateItem(${i},'desc',this.value)" style="flex:3;min-width:0;font-size:13px;"/>
        <input class="item-qty" type="number" min="1" value="${item.qty}" oninput="updateItem(${i},'qty',+this.value)" placeholder="Cant." title="Cantidad" style="width:62px;flex:none;font-size:13px;"/>
        <input class="item-price" type="number" min="0" step="100" value="${item.price||''}" oninput="updateItem(${i},'price',+this.value)" placeholder="$ precio" title="Precio unitario" style="width:96px;flex:none;font-size:13px;"/>
        ${item.price&&item.qty?`<span style="font-size:12px;color:var(--teal-d);font-weight:600;min-width:80px;text-align:right;">${fmtMoney(item.qty*item.price)}</span>`:'<span style="min-width:80px;"></span>'}
      </div>
    </div>`).join('');
  updateInvTotalPreview();
}

function selectTarifa(i,val){
  if(!val)return;
  const parts=val.split('|');
  const desc=parts[0];const price=+parts[1]||0;
  if(!desc)return;
  editItems[i].desc=desc;editItems[i].price=price;
  renderInvItems();
}
function updateItem(i,field,val){editItems[i][field]=val;updateInvTotalPreview();}
function addInvItem(){editItems.push({desc:'',qty:1,price:0});renderInvItems();}
function removeItem(i){if(editItems.length===1)return;editItems.splice(i,1);renderInvItems();}
function updateInvTotalPreview(){
  const total=editItems.reduce((s,i)=>s+(+i.qty*(+i.price)||0),0);
  const prev=document.getElementById('inv-total-preview');
  if(prev)prev.textContent=`Total: ${fmtMoney(total)}`;
}

function invPatientAC(){
  const inp=document.getElementById('inv-patient');const ac=document.getElementById('inv-ac');if(!inp||!ac)return;
  const v=inp.value.toLowerCase().trim();
  const matches=v===''?DB.patients:DB.patients.filter(p=>p.name.toLowerCase().includes(v)||p.tutor.toLowerCase().includes(v));
  if(!matches.length){ac.classList.remove('open');return;}
  ac.classList.add('open');
  ac.innerHTML=matches.slice(0,8).map(p=>`<div class="autocomplete-item" onmousedown="fillInvPatient(${p.id})">${EMOJIS[p.species]} <b>${p.name}</b> <span style="color:var(--ink4);">— ${p.tutor}</span></div>`).join('');
}
function closeInvAC(){const ac=document.getElementById('inv-ac');if(ac)ac.classList.remove('open');}
function fillInvPatient(pid){
  const p=DB.patients.find(x=>x.id===pid);if(!p)return;
  const inp=document.getElementById('inv-patient');if(inp){inp.value=p.name;inp._pid=pid;}
  const ac=document.getElementById('inv-ac');if(ac)ac.classList.remove('open');
  const t=document.getElementById('inv-tutor');if(t)t.value=p.tutor;
  const ph=document.getElementById('inv-phone');if(ph)ph.value=p.phone||'+569';
}

function saveNewInvoice(){
  const patInp=document.getElementById('inv-patient');
  const patient=patInp?patInp.value.trim():'';
  if(!patient){alert('El paciente es obligatorio.');return;}
  const validItems=editItems.filter(i=>i.desc.trim()&&i.price>0);
  if(!validItems.length){alert('Agrega al menos un ítem con descripción y precio.');return;}
  let pid=patInp&&patInp._pid?patInp._pid:null;
  if(!pid){const pp=DB.patients.find(p=>p.name.toLowerCase()===patient.toLowerCase());if(pp)pid=pp.id;}
  DB.invoices.push({
    id:DB.nextInvId++,
    date:document.getElementById('inv-date').value||todayStr(),
    patientId:pid||null,patient,
    tutor:document.getElementById('inv-tutor').value.trim(),
    phone:document.getElementById('inv-phone').value.trim(),
    items:validItems.map(i=>({desc:i.desc.trim(),qty:+i.qty||1,price:+i.price||0})),
    paid:+(document.getElementById('inv-paid').value)||0,
    notes:document.getElementById('inv-notes').value.trim()
  });
  saveDB();closeModal();showToast('Cobro registrado ✓');
  if(view==='patient')renderAll();else{billingFilter='todos';nav('billing');}
}

function openEditInvoiceModal(invId){
  const inv=DB.invoices.find(x=>x.id===invId);if(!inv)return;
  editItems=inv.items.map(i=>({...i}));
  openModal(`<div class="modal modal-lg">
    <div class="modal-title">Editar cobro</div>
    <div class="form-row">
      <div class="form-group"><label>Paciente</label><input id="inv-patient" type="text" value="${inv.patient}"/></div>
      <div class="form-group"><label>Tutor</label><input id="inv-tutor" type="text" value="${inv.tutor||''}"/></div>
    </div>
    <div class="form-row">
      <div class="form-group"><label>Teléfono</label><input id="inv-phone" type="tel" value="${inv.phone||'+569'}" placeholder="+56 9 1234 5678" oninput="sanitizePhoneInput(this)" onkeydown="guardPhoneKeydown(event)"/></div>
      <div class="form-group"><label>Fecha</label><input id="inv-date" type="date" value="${inv.date}"/></div>
    </div>
    <div class="hr"></div>
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;">
      <div class="section-title">ÍTEMS</div>
      <div id="inv-total-preview" style="font-size:16px;font-weight:600;color:var(--teal-d);"></div>
    </div>
    <div id="inv-items-wrap"></div>
    <button class="add-item-btn" onclick="addInvItem()">+ Agregar ítem</button>
    <div class="hr"></div>
    <div class="form-row">
      <div class="form-group"><label>Monto pagado ($)</label><input id="inv-paid" type="number" min="0" step="100" value="${inv.paid}"/></div>
    </div>
    <div class="form-group"><label>Notas</label><textarea id="inv-notes" style="min-height:50px;">${inv.notes||''}</textarea></div>
    <div class="modal-footer">
      <button class="btn btn-danger" onclick="deleteInvoice(${invId})">Eliminar</button>
      <button class="btn" onclick="closeModal()">Cancelar</button>
      <button class="btn btn-teal" onclick="saveEditInvoice(${invId})">Guardar</button>
    </div>
  </div>`);
  renderInvItems();
}
function saveEditInvoice(invId){
  const inv=DB.invoices.find(x=>x.id===invId);if(!inv)return;
  const validItems=editItems.filter(i=>i.desc.trim()&&i.price>0);
  if(!validItems.length){alert('Al menos un ítem con descripción y precio.');return;}
  inv.patient=document.getElementById('inv-patient').value.trim()||inv.patient;
  inv.tutor=document.getElementById('inv-tutor').value.trim();
  inv.phone=document.getElementById('inv-phone').value.trim();
  inv.date=document.getElementById('inv-date').value||inv.date;
  inv.items=validItems.map(i=>({desc:i.desc.trim(),qty:+i.qty||1,price:+i.price||0}));
  inv.paid=+(document.getElementById('inv-paid').value)||0;
  inv.notes=document.getElementById('inv-notes').value.trim();
  saveDB();closeModal();showToast('Cobro actualizado ✓');renderAll();
}
function deleteInvoice(invId){
  if(!confirm('¿Eliminar este cobro?'))return;
  DB.invoices=DB.invoices.filter(x=>x.id!==invId);saveDB();pushDeleteInvoice(invId);showToast('Cobro eliminado');closeModal();renderAll();
}

// Quick pay modal
function openPayModal(invId){
  const inv=DB.invoices.find(x=>x.id===invId);if(!inv)return;
  const debt=invDebt(inv);
  openModal(`<div class="modal modal-sm">
    <div class="modal-title">Registrar pago</div>
    <div style="margin-bottom:14px;font-size:14px;">Paciente: <b>${inv.patient}</b><br>
    Total: <b>${fmtMoney(invTotal(inv))}</b> · Pagado: <b>${fmtMoney(inv.paid)}</b><br>
    <span style="color:var(--red);font-weight:600;">Saldo: ${fmtMoney(debt)}</span></div>
    <div class="form-group"><label>Monto a pagar ($)</label>
      <input id="pay-amount" type="number" min="0" step="100" value="${debt}" placeholder="${debt}"/>
    </div>
    <div class="form-group"><label>Notas</label><input id="pay-notes" type="text" placeholder="Efectivo, transferencia…"/></div>
    <div class="modal-footer">
      <button class="btn" onclick="closeModal()">Cancelar</button>
      <button class="btn btn-green" onclick="registerPay(${invId})">✓ Registrar</button>
    </div>
  </div>`);
}
function registerPay(invId){
  const inv=DB.invoices.find(x=>x.id===invId);if(!inv)return;
  const amt=+(document.getElementById('pay-amount').value)||0;
  if(amt<=0){alert('Ingresa un monto válido.');return;}
  inv.paid=Math.min(inv.paid+amt,invTotal(inv));
  const note=document.getElementById('pay-notes').value.trim();
  if(note)inv.notes=(inv.notes?inv.notes+' · ':'')+note;
  saveDB();closeModal();showToast('Pago registrado ✓');renderAll();
}

// ══════════════════════════════════════════════════════
//  AUTH — LOGIN / LOGOUT
// ══════════════════════════════════════════════════════
// Credenciales — cámbialas aquí cuando quieras
const AUTH_USER = 'constanza';
const AUTH_PASS = 'claumedvet2024';
const SESSION_KEY = 'cmv_session';

function checkSession(){
  return sessionStorage.getItem(SESSION_KEY) === 'ok';
}
function doLogin(){
  const user = document.getElementById('loginUser').value.trim().toLowerCase();
  const pass = document.getElementById('loginPass').value;
  const err  = document.getElementById('loginError');
  if(user === AUTH_USER && pass === AUTH_PASS){
    sessionStorage.setItem(SESSION_KEY,'ok');
    document.getElementById('loginScreen').style.display='none';
    err.style.display='none';
    // Init app after successful login
    loadDB();renderAll();
    pullFromCloud().then(gotCloud=>{
      if(!gotCloud && DB.patients.length===0){initSampleData();syncAllToCloud();}
      renderAll();
    });
  } else {
    err.style.display='block';
    document.getElementById('loginPass').value='';
    document.getElementById('loginPass').focus();
    // Shake animation
    const box=document.querySelector('.login-box');
    box.style.animation='none';
    setTimeout(()=>{box.style.animation='shake .4s ease';},10);
  }
}
function doLogout(){
  if(!confirm('¿Cerrar sesión?'))return;
  sessionStorage.removeItem(SESSION_KEY);
  location.reload();
}

// ══════════════════════════════════════════════════════
//  INIT
// ══════════════════════════════════════════════════════
// ── Wire login UI after DOM+JS ready ──
document.addEventListener('DOMContentLoaded', function(){
  var btn = document.getElementById('loginBtn');
  var user = document.getElementById('loginUser');
  var pass = document.getElementById('loginPass');
  if(btn) btn.addEventListener('click', doLogin);
  if(user) user.addEventListener('keydown', function(e){ if(e.key==='Enter') pass && pass.focus(); });
  if(pass) pass.addEventListener('keydown', function(e){ if(e.key==='Enter') doLogin(); });
});

if(checkSession()){
  // Already logged in — hide login screen and load app
  document.getElementById('loginScreen').style.display='none';
  loadDB();restoreViewState();renderAll();
  pullFromCloud().then(gotCloudData=>{
    if(!gotCloudData && DB.patients.length===0){initSampleData();syncAllToCloud();}
    restoreViewState();renderAll();
  });
}
// If not logged in, login screen stays visible — doLogin() handles the rest
</script>
