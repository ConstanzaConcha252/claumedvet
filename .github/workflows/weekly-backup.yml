name: Respaldo semanal de la base de datos

# Corre todos los lunes a las 12:00 UTC (08:00 en Chile continental,
# hora estándar; en horario de verano serán las 09:00). También se puede
# lanzar a mano desde la pestaña "Actions" del repo con "Run workflow".
on:
  schedule:
    - cron: '0 12 * * 1'
  workflow_dispatch: {}

jobs:
  backup:
    runs-on: ubuntu-latest
    # Corre todo el trabajo dentro de la imagen oficial de Postgres 17 —
    # así pg_dump ya viene en la versión correcta, sin tener que instalarlo
    # ni pelear con repositorios de apt.
    container:
      image: postgres:17

    steps:
      - name: Generar el respaldo (pg_dump, con reintentos)
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        # Si la base no está disponible justo en ese momento (por ejemplo,
        # un reinicio breve de Supabase), reintenta hasta 3 veces esperando
        # 2 minutos entre cada intento, en vez de fallar al primer error.
        run: |
          mkdir -p dump
          STAMP=$(date -u +"%Y-%m-%d")
          FILE="dump/claumedvet-${STAMP}.sql"
          OK=0
          for INTENTO in 1 2 3; do
            echo "Intento ${INTENTO} de 3..."
            if pg_dump "$SUPABASE_DB_URL" --no-owner --no-privileges --file="$FILE"; then
              OK=1
              break
            fi
            if [ "$INTENTO" -lt 3 ]; then
              echo "pg_dump falló; reintentando en 2 minutos..."
              sleep 120
            fi
          done
          if [ "$OK" -ne 1 ]; then
            echo "pg_dump falló en los 3 intentos."
            exit 1
          fi
          gzip "$FILE"
          echo "STAMP=${STAMP}" >> "$GITHUB_ENV"

      - name: Instalar git y curl (no vienen incluidos en la imagen de Postgres)
        run: apt-get update && apt-get install -y git curl

      - name: Ping de actividad a la API de Supabase (evita la pausa por inactividad)
        # El pg_dump de arriba se conecta directo a Postgres vía el Session
        # pooler, y esa conexión NO queda registrada como "actividad" para
        # el sistema de auto-pausa de Supabase (solo cuenta el tráfico que
        # pasa por su API REST/Auth/Storage). Este paso hace un llamado
        # liviano a la API — sin tocar ninguna tabla, así que no choca con
        # las políticas RLS — para que el proyecto nunca acumule 7 días
        # sin actividad y se pause solo.
        # Límite de tiempo y continue-on-error: si Supabase no responde,
        # el ping se abandona a los 30 segundos y NO bloquea ni hace fallar
        # el respaldo.
        timeout-minutes: 2
        continue-on-error: true
        run: |
          curl -s --max-time 30 -o /dev/null -w "Supabase API respondió: %{http_code}\n" \
            "https://jxhotwoeaozlqtujwodz.supabase.co/rest/v1/" \
            -H "apikey: sb_publishable_q8oHQ5NJE6x0SrIysJVbSA_OuYX41vY"

      - name: Clonar el repositorio privado de respaldos
        env:
          BACKUP_REPO_TOKEN: ${{ secrets.BACKUP_REPO_TOKEN }}
          BACKUP_REPO: ${{ secrets.BACKUP_REPO }}
        run: |
          set -e
          git clone "https://x-access-token:${BACKUP_REPO_TOKEN}@github.com/${BACKUP_REPO}.git" backups-repo

      - name: Copiar el respaldo y subirlo
        run: |
          set -e
          mkdir -p backups-repo/backups
          cp "dump/claumedvet-${STAMP}.sql.gz" "backups-repo/backups/"
          cd backups-repo
          git config user.name "claumedvet-backup-bot"
          git config user.email "actions@users.noreply.github.com"
          git add "backups/claumedvet-${STAMP}.sql.gz"
          git commit -m "Respaldo semanal ${STAMP}" || echo "Nada nuevo que respaldar"
          git push
